# Render Blueprint for the free, non-expiring deploy path.
#
# Web service  -> Render free plan (free forever, sleeps after 15 min idle)
# Postgres     -> Neon free plan (permanent). NOT Render Postgres, whose free
#                 instance is deleted after 30 days. DATABASE_URL is set in the
#                 Render dashboard and must point at Neon (append
#                 ?sslmode=require to the connection string).
#
# Deploy: connect this repo to Render, click "New > Blueprint" and pick render.yaml.
services:
  - type: web
    name: cricket-prediction
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /api/teams
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    preDeployCommand: sh data_load.sh
    envVars:
      - key: ENVIRONMENT
        value: production
        sync: false
      # Set these in the Render dashboard under Environment after first deploy:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # The Vercel frontend proxies /api/* to this service; the browser's
      # Origin is the Vercel domain, so add it here (comma-separated) or the
      # session refresh / logout cookie-auth endpoints will 403. e.g.
      #   ALLOWED_ORIGINS=https://matchcall.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # Accounts allowed to load match data via the /admin panel
      # (comma-separated emails). Leave empty to keep everyone read-only.
      - key: ADMIN_EMAILS
        sync: false
