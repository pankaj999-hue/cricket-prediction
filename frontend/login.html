<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATCHCALL — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<script defer src="js/auth.js"></script>
</head>
<body>

<div class="chevron-strip"></div>

<nav>
  <div class="logo"><span class="logo-chev"></span>MATCHCALL</div>
</nav>

<section class="auth-hero">
  <div class="auth-card">
    <div class="auth-eyebrow">// SECURE ACCESS</div>
    <h1 class="auth-title" id="authTitle">Welcome back</h1>
    <p class="auth-sub" id="authSub">Sign in to open the prediction engine.</p>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-mode="login">Sign in</button>
      <button type="button" class="auth-tab" data-mode="register">Create account</button>
    </div>

    <form class="auth-form" id="authForm" novalidate>
      <label class="auth-field">
        <span>Name <em id="nameReq" class="auth-req">(optional)</em></span>
        <input type="text" id="authName" placeholder="Your name" autocomplete="name">
      </label>
      <label class="auth-field">
        <span>Email</span>
        <input type="email" id="authEmail" placeholder="you@email.com" autocomplete="email" required>
      </label>
      <label class="auth-field">
        <span>Password</span>
        <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required>
      </label>
      <div class="auth-msg" id="authMsg"></div>
      <button type="submit" class="auth-btn" id="authBtn">Sign in</button>
    </form>

    <div class="auth-hint">Rate-limited to protect your account.<br>Predictions are limited to 20 per minute.</div>
  </div>
</section>

<div class="chevron-strip"></div>

</body>
</html>
